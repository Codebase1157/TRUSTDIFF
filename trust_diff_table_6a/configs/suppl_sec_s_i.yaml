# Supplementary Section S-I — Reduced setting
# Replaces the frozen ADM prior with a guided-filter denoiser and the
# TPC encoder with hand-crafted descriptors. Produces the context for
# Sect. 5.5.3 and the negative RG at every zeta (reconciled in Table 7a).
extends: _base.yaml

item: "Suppl. Sect. S-I"
model_configuration: "Reduced: guided-filter denoiser + hand-crafted descriptors"
seeds: [0]

prior:
  denoiser: guided_filter           # overrides _base.yaml
  params: 0
  checkpoint_name: null
  inflate_io_to_k_channels: false
  finetune: null

encoder_gnn:
  replaced_by: hand_crafted_sift_like_descriptors
  L_blocks: null
  width: null

checkpoints_used: none              # listed as "none" in Table 6a

outputs:
  suppl_report: suppl/sec_S_I_metrics.csv
  note: |
    H1 is NOT assessed in this reduced setting; this exists only to
    document the gap between the reduced and complete pipelines that
    Table 7a reconciles.
