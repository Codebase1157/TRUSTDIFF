# Figs. 5, 6 — Visualization results on Houston + Pavia
# Mechanism-surrogate comparison columns built on the shared sampler and prior.
extends: _base.yaml

item: "Figs. 5, 6"
model_configuration: "Complete"
seeds: [0, 1, 2]

datasets:
  test_tiles: [houston_2013, pavia_university]

methods_compared:
  - bicubic
  - argmax_always_transfer     # mechanism surrogate
  - trust_diff_complete

outputs:
  fig5: figures/fig5_houston_visualization.png
  fig6: figures/fig6_pavia_visualization.png
  bundle_metrics:
    psnr_report: tables/psnr_fig5_fig6.csv

notes: |
  The comparison columns of Figs. 5 and 6 are mechanism surrogates that
  isolate the transfer rule; they must NOT be read as re-runs of any
  published method. Mean ± seed-std over {0, 1, 2}.
