# Fig. 13 — tau sweep (parameter sensitivity, small multiples)
# RIH dependence on the transport parameters (what H2 actually claims).
extends: _base.yaml

item: "Fig. 13"
model_configuration: "Complete"
seeds: [0, 1, 2]

datasets:
  test_tiles: [houston_2013]

parameter_sweep:
  tau_grid: [0.05, 0.10, 0.15, 0.30, 1.0, 1000.0]   # last two near-balanced
  epsilon_fixed: 0.1
  alpha_fixed: 0.5

outputs:
  fig13: figures/fig13_tau_sensitivity.png
  table_sensitivity: tables/fig13_rih_vs_tau.csv
