# Figs. 1, 2 — Architecture + encoder diagnostics
# Panel values reproduce: AUROC 0.858 on Houston during sampling,
# 0.915 when region graph is built on ground-truth target;
# mean m = 0.54 corresponding vs 0.24 non-corresponding regions.
extends: _base.yaml

item: "Figs. 1, 2"
model_configuration: "Complete: prior [15] + TPC encoder"
seeds: [0]

datasets:
  test_tiles: [houston_2013]

outputs:
  - fig1: figures/fig1_architecture_overview.svg
  - fig2: figures/fig2_encoder_region_graph.svg
  - metrics:
      auroc_during_sampling: 0.858
      auroc_region_graph_on_gt: 0.915
      mean_m_corresponding: 0.54
      mean_m_noncorresponding: 0.24

notes: |
  Figs. 1 and 2 are diagrammatic; the numeric panels come from one
  forward pass on the Houston validation tile with seed 0. No sweep
  needed — seed 0 only.
