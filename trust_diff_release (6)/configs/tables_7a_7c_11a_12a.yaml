# Tables 7a–7c, 11a, 12a — Secondary CNC-Bench and ablation tables
# 7a: reconciles the reduced vs complete settings on the same tiles and
#     splits RG into corresponding vs non-corresponding parts.
# 7b: reports the mismatches used to test the known-operator assumption.
# 7c: per-sensor operator mismatches.
# 11a: encoder ablation.
# 12a: GNN ablation.
extends: _base.yaml

item: "Tables 7a–7c, 11a, 12a"
model_configuration: "Complete"
seeds: [0, 1, 2]

datasets:
  test_tiles: [houston_2013, pavia_university]

splits:
  cnc_bench: true
  corresponding_vs_noncorresponding: true
  operator_mismatches:
    sensor_variants: [CASI_default, CASI_perturbed_1pct, CASI_perturbed_3pct]

outputs:
  table7a: tables/table7a_rg_split.csv
  table7b: tables/table7b_operator_mismatch_summary.csv
  table7c: tables/table7c_operator_mismatch_details.csv
  table11a: tables/table11a_encoder_ablation.csv
  table12a: tables/table12a_gnn_ablation.csv
